<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>応募書類 | Eom Junho Portfolio</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div class="detail-page">

    <aside class="side-bar">
        <div class="profile-section">
            <img
                    src="/files/profile-avatar-sharp-192.jpg"
                    srcset="/files/profile-avatar-sharp-192.jpg 1x,
                /files/profile-avatar-sharp-384.jpg 2x"
                    alt="Profile photo"
                    class="profile-img">

            <h1 class="profile-name">嚴 俊浩</h1>
            <p class="profile-`t`itle">Java / Spring Web Application Engineer</p>
        </div>

        <nav class="side-nav">
            <a th:href="@{/about}">自己紹介</a>
            <a th:href="@{/projects}">経歴</a>
            <a th:href="@{/skills}">スキル</a>
            <a class="active" th:href="@{/documents}">書類</a>
            <a th:href="@{/info}">サイト説明</a>
        </nav>

        <div class="side-footer">
            <a th:href="@{/}">トップへ戻る</a>
        </div>
    </aside>

    <main class="detail-content">
        <section class="content-card">
            <p class="content-label">Resume</p>

            <h1>書類</h1>

            <p>
                履歴書および職務経歴書をPDF形式でダウンロードできます。
            </p>

            <div class="document-buttons">
                <a class="document-button" th:href="@{/files/履歴書_嚴俊浩（オムジュンホ）.pdf}" download>
                    履歴書をダウンロード
                </a>
                <a class="document-button" th:href="@{/files/職務経歴書_嚴俊浩（オムジュンホ）.pdf}" download>
                    職務経歴書をダウンロード
                </a>
            </div>
            <div class="documents-updated-date">
                <p class="document-meta">PDF / 最終更新：2026年08月04日</p>
            </div>
        </section>
    </main>

</div>
</body>
</html>
